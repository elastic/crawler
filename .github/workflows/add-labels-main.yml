name: Force backport labels for main

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened

# Override read-only GITHUB_TOKEN default: label newly opened PRs.
permissions:
  contents: read
  pull-requests: write

jobs:
  add_labels:
    runs-on: ubuntu-latest
    steps:
      # Target the maintenance branches (see .backportrc.json). Do not label with main's own
      # version (v1.2.0): the backport tool would map it to a non-existent 1.2 branch and fail.
      # Update this list when a maintenance line is added or retired.
      - uses: actions-ecosystem/action-add-labels@18f1af5e3544586314bbe15c0273249c770b2daf # v1
        with:
          labels: |
            auto-backport
            v1.1.0
            v1.0.0
