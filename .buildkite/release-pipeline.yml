## 🏠/.buildkite/pipeline-release.yml
# Manual triggered pipeline to build and publish Docker images.
#
# Defaults to SNAPSHOT. To publish a release image, the operator must
# explicitly choose "Release" in the input step AND trigger from an N.N branch.

notify:
  - if: 'build.branch =~ /^((main)|([0-9]+\.[0-9]+))\$/ && (build.state == "failed" || pipeline.started_passing)'
    slack:
      channels:
        - "#search-et-alerts"
      message: "${BUILDKITE_MESSAGE}"

steps:
  - input: "Build information"
    fields:
      - select: "Build type"
        key: "build_type"
        hint: "Snapshot is the default. Choose Release only when cutting an actual release from an N.N branch."
        default: "snapshot"
        options:
          - label: "Snapshot"
            value: "snapshot"
          - label: "Release"
            value: "release"
      - select: "Apply :latest tag?"
        key: "is_latest"
        hint: "Only applies to Release builds. Ignored for Snapshots."
        default: "false"
        options:
          - label: "Yes"
            value: "true"
          - label: "No"
            value: "false"
  - wait: ~

  # ----
  # Resolve build type into is_snapshot metadata.
  # Release builds are only allowed from N.N branches — requesting a
  # release from main is rejected to prevent accidents.
  # ----
  - label: ":shield: Resolve build type"
    command: |
      BUILD_TYPE=$$(buildkite-agent meta-data get build_type)
        if [[ ! "$$BUILDKITE_BRANCH" =~ ^[0-9]+\.[0-9]+$$ ]]; then
          echo "ERROR: Release builds require an N.N branch (for example, 1.0)."
          exit 1
        fi
        buildkite-agent meta-data set is_snapshot false
        echo "Build type: RELEASE (branch: $$BUILDKITE_BRANCH)"
      else
        buildkite-agent meta-data set is_snapshot true
        echo "Build type: SNAPSHOT (branch: $$BUILDKITE_BRANCH)"
      fi
  - wait: ~

  # ----
  # Docker builds for amd64
  # ----
  - group: ":package: amd64 Build and Test"
    key: "build_and_test_amd64"
    steps:
      - label: "Building amd64 Docker image"
        agents:
          provider: aws
          instanceType: m6i.xlarge
          imagePrefix: ci-amazonlinux-2
        env:
          ARCHITECTURE: "amd64"
          DOCKERFILE_PATH: "Dockerfile.wolfi"
        command: ".buildkite/publish/build-docker.sh"
        key: "build_docker_image_amd64"
        artifact_paths: ".artifacts/*.tar.gz"
      - label: "Testing amd64 Docker image"
        agents:
          provider: aws
          instanceType: m6i.xlarge
          imagePrefix: ci-amazonlinux-2
        env:
          ARCHITECTURE: "amd64"
          DOCKERFILE_PATH: "Dockerfile.wolfi"
        depends_on: "build_docker_image_amd64"
        commands:
          - "mkdir -p .artifacts"
          - buildkite-agent artifact download '.artifacts/*.tar.gz*' .artifacts/ --step build_docker_image_amd64
          - ".buildkite/publish/test-docker.sh"
  # ----
  # Docker builds for arm64
  # ----
  - group: ":package: arm64 Build and Test"
    key: "build_and_test_arm64"
    steps:
      - label: "Building arm64 Docker image"
        agents:
          provider: aws
          instanceType: m6g.xlarge
          imagePrefix: ci-amazonlinux-2-aarch64
          diskSizeGb: 40
          diskName: '/dev/xvda'
        env:
          ARCHITECTURE: "arm64"
          DOCKERFILE_PATH: "Dockerfile.wolfi"
        command: ".buildkite/publish/build-docker.sh"
        key: "build_docker_image_arm64"
        artifact_paths: ".artifacts/*.tar.gz"
      - label: "Testing arm64 Docker image"
        agents:
          provider: aws
          instanceType: m6g.xlarge
          imagePrefix: ci-amazonlinux-2-aarch64
          diskSizeGb: 40
          diskName: '/dev/xvda'
        env:
          ARCHITECTURE: "arm64"
          DOCKERFILE_PATH: "Dockerfile.wolfi"
        depends_on: "build_docker_image_arm64"
        commands:
          - "mkdir -p .artifacts"
          - buildkite-agent artifact download '.artifacts/*.tar.gz*' .artifacts/ --step build_docker_image_arm64
          - ".buildkite/publish/test-docker.sh"
  # ----
  # Multiarch Docker image build and push
  # ----
  - group: ":truck: Publish images"
    depends_on:
      - "build_and_test_amd64"
      - "build_and_test_arm64"
    steps:
      - label: "Push amd64 Docker image"
        key: "push_amd64_docker_image"
        env:
          ARCHITECTURE: "amd64"
          DOCKERFILE_PATH: "Dockerfile.wolfi"
        agents:
          provider: aws
          instanceType: m6i.xlarge
          imagePrefix: ci-amazonlinux-2
        commands:
          - "mkdir -p .artifacts"
          - buildkite-agent artifact download '.artifacts/*.tar.gz*' .artifacts/ --step build_docker_image_amd64
          - ".buildkite/publish/push-docker.sh"
      - label: "Push arm64 Docker image"
        key: "push_arm64_docker_image"
        env:
          ARCHITECTURE: "arm64"
          DOCKERFILE_PATH: "Dockerfile.wolfi"
        agents:
          provider: aws
          instanceType: m6g.xlarge
          imagePrefix: ci-amazonlinux-2-aarch64
          diskSizeGb: 40
          diskName: '/dev/xvda'
        commands:
          - "mkdir -p .artifacts"
          - buildkite-agent artifact download '.artifacts/*.tar.gz*' .artifacts/ --step build_docker_image_arm64
          - ".buildkite/publish/push-docker.sh"
      - label: "Build and push multiarch Docker image"
        agents:
          image: "docker.elastic.co/ci-agent-images/drivah:0.25.0"
          ephemeralStorage: "20G"
          memory: "4G"
        command: ".buildkite/publish/build-and-push-multiarch-docker.sh"
        depends_on:
          - "push_amd64_docker_image"
          - "push_arm64_docker_image"
